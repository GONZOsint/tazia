# Coturn for TAZIA local / LAN testing (Docker Compose).
# Production: add TLS (cert/pkey), tighten peer ranges, rotate credentials.

listening-port=3478
# Relay UDP range — keep narrow for Docker port publishes (Windows/macOS Desktop).
min-port=49160
max-port=49200

fingerprint
lt-cred-mech
realm=tazia.local

# Dev/LAN: plain TURN (browsers on localhost/LAN). Prefer turns: + TLS in production.
no-tls
no-dtls
no-cli

# Log to stdout for `docker compose logs` (add `verbose` while debugging)
log-file=stdout
simple-log

# Auth — override via TURN_USER / TURN_PASS in compose (see entrypoint).
# user=tazia:change-me

# Listening on all interfaces inside the container.
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# external-ip is injected by docker-compose from EXTERNAL_IP (host LAN/public IP).
# Without it, browsers behind NAT get unusable relay candidates.

# Mobility / bogon filtering: allow RFC1918 peers for LAN testing.
no-multicast-peers
# Do not deny private peers — TAZIA often runs on the same LAN as the TURN host.
# denied-peer-ip=...

# Keep allocation lifetime reasonable for tab sessions / small tribes.
user-quota=24
total-quota=240
stale-nonce=600

# Faster allocate for first join after container start (LAN smoke / Fix panel).
max-allocate-lifetime=3600
channel-lifetime=600
